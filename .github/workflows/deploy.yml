name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Seite liegt unter https://<user>.github.io/<repo>/
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"
      # Lizenzen der gebündelten Pakete mit ausliefern (Link in den Einstellungen)
      - run: cp dist/stempeluhr/3rdpartylicenses.txt dist/stempeluhr/browser/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/stempeluhr/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
